name: Deploy Vit Tracker v54
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename v54 file to index.html
        run: |
          git config user.name "WindVN"
          git config user.email "windvn@users.noreply.github.com"
          git mv vision-110-log.html index.html
          git commit -m "Deploy Vit Tracker v54: revert to v52 design, fix expense tab"
          git push
